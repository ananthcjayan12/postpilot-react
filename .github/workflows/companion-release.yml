name: Build companion installers
on:
  workflow_dispatch:
  push:
    tags: ['companion-v*']
  pull_request:
    paths:
      - 'apps/companion-desktop/**'
      - '.github/workflows/companion-release.yml'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion-desktop/src-tauri -> target
      - run: npm ci
      - name: Check version matches release tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/companion-desktop/src-tauri/tauri.conf.json').version")
          echo "COMPANION_VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "companion-v$VERSION" ]]; then
            echo "Tag must match the companion version: companion-v$VERSION"
            exit 1
          fi
      - name: Rust formatting, tests and lint
        working-directory: apps/companion-desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Import optional Windows signing certificate
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $file = Join-Path $env:RUNNER_TEMP 'postpilot-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
              $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $file -CertStoreLocation Cert:\CurrentUser\My -Password $password
              "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
            } finally { Remove-Item $file -ErrorAction SilentlyContinue }
          }
      - name: Configure installer signing
        run: node apps/companion-desktop/scripts/release-config.mjs
        env:
          APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: apps/companion-desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/release.config.json -- --locked
      - name: Name installers and compute checksums
        run: python apps/companion-desktop/scripts/collect-artifacts.py ${{ matrix.target }} ${{ env.COMPANION_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.target }}
          path: apps/companion-desktop/release-assets/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/companion-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          merge-multiple: true
          path: installers
      - name: Publish release with all three installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd installers && sha256sum --check *.sha256)
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "This release is already published; use a new version tag"'
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "PostPilot Companion ${RELEASE_TAG#companion-v}" --notes-file apps/companion-desktop/RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
