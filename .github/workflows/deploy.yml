name: Deploy PostPilot to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: postpilot-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run db:migrate
      - name: Provision, migrate, and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          ALLOWED_OWNER_EMAIL: ${{ vars.ALLOWED_OWNER_EMAIL }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          STORAGE_QUOTA_BYTES: ${{ vars.STORAGE_QUOTA_BYTES }}
        run: |
          npm run deploy:prepare
          npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.generated.json
          npm run deploy
      - name: Verify public deployment
        run: node scripts/cloudflare/smoke-test.mjs
